<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寻道大千 · 社交修仙</title>
  <link rel="icon" href="assets/images/v2/icons/icon-cultivate.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.SUPABASE_URL = 'https://fczkdiakiykcgctrffur.supabase.co';
    window.SUPABASE_KEY = 'sb_publishable_ZBRpp9ITVRY0Ipj2haU09Q_fAB6S-hg';
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 登录页 -->
  <div id="login-screen">
    <div class="login-bg"></div>
    <div class="login-art">
      <img src="assets/images/character/idle/frame-01.png" alt="修炼者" />
    </div>
    <div class="login-card">
      <div class="login-logo"><img src="assets/images/v2/icons/icon-cultivate.png" alt="" /></div>
      <div class="login-title">寻道大千</div>
      <div class="login-subtitle">社交修仙 · 砍树证道 · 天道酬勤</div>
      <div class="role-select">
        <div class="role-card active" data-role="player" onclick="Auth.selectRole('player')">
          <img class="role-art role-art-player" src="assets/images/character/idle/frame-01.png" alt="" />
          <div class="name">修炼者</div>
          <div class="desc">砍树证道</div>
        </div>
        <div class="role-card" data-role="admin" onclick="Auth.selectRole('admin')">
          <img class="role-art" src="assets/images/v2/icons/icon-breakthrough.png" alt="" />
          <div class="name">天道</div>
          <div class="desc">执掌天规</div>
        </div>
      </div>
      <div class="form-group">
        <label>道号密码</label>
        <input type="password" id="login-password" placeholder="请输入道号密码" onkeydown="if(event.key==='Enter')Auth.doLogin()">
      </div>
      <button class="btn btn-primary btn-block" onclick="Auth.doLogin()">入道</button>
      <p style="font-size:12px;color:var(--text-light);margin-top:16px;text-align:center;">修炼者：player &nbsp;|&nbsp; 天道：admin</p>
    </div>
  </div>

  <!-- 修炼者主页 -->
  <div id="player-dashboard" class="app" style="display:none">
    <main class="app-main" id="player-main"></main>

    <nav class="bottom-nav">
      <div class="nav-item active" data-tab="cultivate" onclick="Router.playerTab('cultivate')">
        <div class="nav-icon"><img class="nav-icon-img" src="assets/images/v2/icons/icon-cultivate.png" alt="" /></div>
        <div class="nav-text">修仙</div>
      </div>
      <div class="nav-item" data-tab="tasks" onclick="Router.playerTab('tasks')">
        <div class="nav-icon"><img class="nav-icon-img" src="assets/images/v2/icons/icon-tasks.png" alt="" /></div>
        <div class="nav-text">任务</div>
      </div>
      <div class="nav-item" data-tab="reward" onclick="Router.playerTab('reward')">
        <div class="nav-icon"><img class="nav-icon-img" src="assets/images/v2/icons/icon-reward.png" alt="" /></div>
        <div class="nav-text">天道酬勤</div>
      </div>
      <div class="nav-item admin-only" data-tab="admin" onclick="Router.playerTab('admin')" style="display:none">
        <div class="nav-icon"><img class="nav-icon-img" src="assets/images/v2/icons/icon-breakthrough.png" alt="" /></div>
        <div class="nav-text">天道</div>
      </div>
    </nav>
  </div>

  <!-- 天道后台主页 -->
  <div id="admin-dashboard" class="app" style="display:none">
    <header class="app-header">
      <div class="header-left">
        <span class="player-avatar"><img class="admin-avatar-icon" src="assets/images/v2/icons/icon-breakthrough.png" alt="" /></span>
        <div class="player-info">
          <div class="player-name">天道</div>
          <div class="player-level">
            <span class="level-badge admin-badge">执掌天规</span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <button class="btn btn-ghost btn-sm" onclick="Auth.logout()">退出</button>
      </div>
    </header>
    <main class="app-main" id="admin-main"></main>
    <nav class="bottom-nav">
      <div class="nav-item active" data-tab="task-manage" onclick="Router.adminTab('task-manage')">
        <div class="nav-icon"><img class="nav-icon-img" src="assets/images/v2/icons/icon-tasks.png" alt="" /></div>
        <div class="nav-text">任务管理</div>
      </div>
      <div class="nav-item" data-tab="review" onclick="Router.adminTab('review')">
        <div class="nav-icon"><img class="nav-icon-img" src="assets/images/v2/icons/icon-achievement.png" alt="" /></div>
        <div class="nav-text">审核</div>
      </div>
      <div class="nav-item" data-tab="withdraw" onclick="Router.adminTab('withdraw')">
        <div class="nav-icon"><img class="nav-icon-img" src="assets/images/v2/icons/icon-wallet.png" alt="" /></div>
        <div class="nav-text">提现审批</div>
      </div>
      <div class="nav-item" data-tab="player-view" onclick="Router.adminTab('player-view')">
        <div class="nav-icon"><img class="nav-icon-img" src="assets/images/v2/icons/icon-cultivate.png" alt="" /></div>
        <div class="nav-text">查看玩家</div>
      </div>
      <div class="nav-item" data-tab="gm" onclick="Router.adminTab('gm')">
        <div class="nav-icon"><img class="nav-icon-img" src="assets/images/v2/icons/icon-forge.png" alt="" /></div>
        <div class="nav-text">GM工具</div>
      </div>
    </nav>
  </div>

  <!-- 通用容器 -->
  <div id="modal-container"></div>
  <div id="toast-container" class="toast-container"></div>
  <div id="floating-items-container"></div>

  <script src="game-config.js"></script>
  <script src="gameplay-rules.js"></script>
  <script src="operation-guard.js"></script>
  <script src="character-animator.js"></script>
  <script src="cultivation-effects.js"></script>
  <script src="app.js"></script>
</body>
</html>
