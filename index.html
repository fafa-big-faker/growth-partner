<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星途远航 · 社交成长星际之旅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== CSS Variables & Reset ===== */
    :root {
      --primary: #818cf8;
      --primary-light: #a5b4fc;
      --primary-lighter: #1e1b4b;
      --primary-dark: #6366f1;
      --accent: #f472b6;
      --accent-light: #f9a8d4;
      --accent-lighter: #3f2a4d;
      --star-gold: #fbbf24;
      --bg: #0f0a1f;
      --bg-secondary: #1a1333;
      --card: rgba(30, 27, 75, 0.6);
      --card-solid: #1e1b4b;
      --text: #e8e6f5;
      --text-secondary: #a5a0c0;
      --text-light: #6b6688;
      --border: rgba(129, 140, 248, 0.2);
      --shadow: 0 2px 16px rgba(99, 102, 241, 0.15);
      --shadow-hover: 0 4px 28px rgba(99, 102, 241, 0.25);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: all 0.3s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }
    /* ===== Starfield Background ===== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 40px 70px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1.5px 1.5px at 50px 160px, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.5), transparent),
        radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 160px 120px, rgba(255,255,255,0.5), transparent),
        radial-gradient(1.5px 1.5px at 200px 50px, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 250px 150px, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 300px 100px, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 350px 200px, rgba(255,255,255,0.4), transparent);
      background-repeat: repeat;
      background-size: 400px 250px;
      animation: twinkle 4s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes twinkle {
      from { opacity: 0.6; }
      to { opacity: 1; }
    }
    body > * { position: relative; z-index: 1; }
    /* ===== Login Screen ===== */
    #login-screen {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #1e1b4b 0%, #0f0a1f 70%);
      padding: 20px;
    }
    .login-card {
      background: rgba(30, 27, 75, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 24px; padding: 48px 40px;
      box-shadow: 0 8px 48px rgba(99, 102, 241, 0.2);
      max-width: 440px; width: 100%; text-align: center;
    }
    .login-logo { font-size: 56px; margin-bottom: 8px; animation: float 3s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .login-title { font-size: 28px; font-weight: 700; color: var(--primary-light); margin-bottom: 4px; }
    .login-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 32px; }
    .role-select { display: flex; gap: 16px; margin-bottom: 24px; }
    .role-card {
      flex: 1; border: 2px solid var(--border); border-radius: var(--radius); padding: 20px 12px;
      cursor: pointer; transition: var(--transition); text-align: center;
      background: rgba(15, 10, 31, 0.5);
    }
    .role-card:hover { border-color: var(--primary-light); background: var(--primary-lighter); transform: translateY(-2px); }
    .role-card.active { border-color: var(--primary); background: var(--primary-lighter); }
    .role-card .emoji { font-size: 36px; }
    .role-card .name { font-size: 16px; font-weight: 600; margin-top: 8px; }
    .role-card .desc { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-size: 14px; font-family: inherit; transition: var(--transition);
      background: rgba(15, 10, 31, 0.7); color: var(--text);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .btn {
      padding: 10px 20px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500;
      cursor: pointer; transition: var(--transition); font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
    .btn-primary:hover { background: linear-gradient(135deg, var(--primary-light), var(--primary)); transform: translateY(-1px); box-shadow: var(--shadow-hover); }
    .btn-accent { background: linear-gradient(135deg, var(--accent), #ec4899); color: white; }
    .btn-accent:hover { background: linear-gradient(135deg, var(--accent-light), var(--accent)); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(244, 114, 182, 0.3); }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary-light); background: var(--primary-lighter); }
    .btn-ghost { background: transparent; color: var(--text-secondary); padding: 6px 12px; }
    .btn-ghost:hover { background: var(--primary-lighter); color: var(--primary-light); }
    .btn-block { width: 100%; justify-content: center; padding: 12px; font-size: 15px; }
    .btn-sm { padding: 6px 14px; font-size: 13px; }
    .btn-gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #1a1333; font-weight: 600; }
    .btn-gold:hover { background: linear-gradient(135deg, #fcd34d, #fbbf24); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    /* ===== Dashboard Layout ===== */
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .app-header {
      background: rgba(30, 27, 75, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border); padding: 0 24px;
      height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
    }
    .app-header .logo { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; color: var(--primary-light); }
    .app-header .user-info { display: flex; align-items: center; gap: 12px; }
    .app-header .user-name { font-size: 14px; font-weight: 500; }
    .app-header .user-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: var(--primary-lighter);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
      border: 1px solid var(--border);
    }
    .app-nav {
      background: rgba(30, 27, 75, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; gap: 4px; overflow-x: auto;
    }
    .nav-item {
      padding: 12px 20px; font-size: 14px; font-weight: 500; color: var(--text-secondary);
      cursor: pointer; transition: var(--transition); border-bottom: 2px solid transparent; white-space: nowrap;
    }
    .nav-item:hover { color: var(--primary-light); }
    .nav-item.active { color: var(--primary-light); border-bottom-color: var(--primary); }
    .app-main { flex: 1; padding: 24px; max-width: 1200px; margin: 0 auto; width: 100%; }
    /* ===== Components ===== */
    .page-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
    .page-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-title { font-size: 18px; font-weight: 600; }
    .card {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow); margin-bottom: 16px;
    }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--primary-light); }
    .task-card {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      border-left: 4px solid var(--primary);
      transition: var(--transition);
    }
    .task-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
    .task-card.star-1 { border-left-color: #60a5fa; }
    .task-card.star-2 { border-left-color: #34d399; }
    .task-card.star-3 { border-left-color: #fbbf24; }
    .task-card.star-4 { border-left-color: #f472b6; }
    .task-card.star-5 { border-left-color: #a78bfa; }
    .task-card-header { display: flex; align-items: start; justify-content: space-between; margin-bottom: 8px; gap: 12px; }
    .task-card-title { font-size: 16px; font-weight: 600; }
    .task-card-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .tag {
      display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500;
    }
    .tag-category { background: var(--primary-lighter); color: var(--primary-light); }
    .tag-star { background: rgba(251, 191, 36, 0.15); color: var(--star-gold); }
    .tag-star .star-icon { margin-right: 2px; }
    .tag-status-available { background: rgba(96, 165, 250, 0.15); color: #60a5fa; }
    .tag-status-progress { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
    .tag-status-review { background: rgba(244, 114, 182, 0.15); color: #f472b6; }
    .tag-status-done { background: rgba(52, 211, 153, 0.15); color: #34d399; }
    .tag-status-abandoned { background: rgba(107, 102, 136, 0.15); color: var(--text-light); }
    .task-actions { display: flex; gap: 8px; margin-top: 8px; }
    .energy-reward { display: inline-flex; align-items: center; gap: 4px; color: var(--star-gold); font-weight: 600; font-size: 13px; }
    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow); text-align: center;
      transition: var(--transition);
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
    .stat-icon { font-size: 28px; margin-bottom: 8px; }
    .stat-value { font-size: 32px; font-weight: 700; color: var(--primary-light); }
    .stat-value.gold { color: var(--star-gold); }
    .stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
    /* Progress Bar */
    .progress-bar-wrap { background: rgba(129, 140, 248, 0.15); border-radius: 20px; height: 12px; overflow: hidden; margin-top: 8px; }
    .progress-bar { background: linear-gradient(90deg, var(--primary), var(--accent)); height: 100%; border-radius: 20px; transition: width 0.6s ease; }
    .progress-bar.gold { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
    /* Empty State */
    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-light); }
    .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
    .modal {
      background: var(--card-solid);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 28px; max-width: 520px; width: 100%;
      max-height: 85vh; overflow-y: auto; box-shadow: 0 8px 48px rgba(0,0,0,0.4);
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-title { font-size: 18px; font-weight: 700; color: var(--primary-light); }
    .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-light); padding: 4px; }
    .modal-close:hover { color: var(--text); }
    .modal-footer { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
    /* Toast */
    .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .toast {
      background: var(--primary-dark); color: white; padding: 12px 24px; border-radius: 24px; font-size: 14px;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4); animation: toastIn 0.3s ease; max-width: 90vw;
    }
    .toast.success { background: linear-gradient(135deg, #34d399, #10b981); }
    .toast.warn { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #1a1333; }
    .toast.error { background: linear-gradient(135deg, #f87171, #ef4444); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    /* Reward / Supply Station card */
    .supply-card {
      display: flex; align-items: center; gap: 16px; padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm); margin-bottom: 12px;
      transition: var(--transition);
    }
    .supply-card:hover { border-color: var(--primary-light); box-shadow: var(--shadow-hover); }
    .supply-emoji { font-size: 36px; }
    .supply-info { flex: 1; }
    .supply-name { font-size: 15px; font-weight: 600; }
    .supply-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .supply-cost { display: flex; align-items: center; gap: 4px; color: var(--star-gold); font-weight: 700; font-size: 16px; }
    /* Table */
    .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table th { text-align: left; padding: 10px 12px; background: var(--primary-lighter); color: var(--text-secondary); font-weight: 500; border-radius: 8px; }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .data-table tr:hover td { background: rgba(129, 140, 248, 0.08); }
    /* Chart container */
    .chart-wrap {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow); margin-bottom: 16px;
    }
    .chart-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--primary-light); }
    .chart-container { display: flex; align-items: center; justify-content: center; }
    /* Star rating */
    .star-rating { display: inline-flex; gap: 2px; }
    .star-rating .star { color: var(--text-light); font-size: 14px; }
    .star-rating .star.filled { color: var(--star-gold); text-shadow: 0 0 6px rgba(251, 191, 36, 0.5); }
    /* Filter bar */
    .filter-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-bar select, .filter-bar input {
      padding: 8px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit;
      background: rgba(15, 10, 31, 0.7); color: var(--text);
    }
    /* Report */
    .report-card {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
      box-shadow: var(--shadow); margin-bottom: 16px;
    }
    .report-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .report-title { font-size: 18px; font-weight: 700; color: var(--primary-light); }
    .report-section { margin-bottom: 16px; }
    .report-section h4 { font-size: 15px; font-weight: 600; margin-bottom: 8px; color: var(--primary-light); }
    .report-section p { font-size: 14px; color: var(--text-secondary); line-height: 1.8; }
    .report-stats { display: flex; gap: 24px; margin-bottom: 16px; flex-wrap: wrap; }
    .report-stat { text-align: center; }
    .report-stat .num { font-size: 24px; font-weight: 700; color: var(--primary-light); }
    .report-stat .label { font-size: 12px; color: var(--text-secondary); }
    /* ===== Star Map ===== */
    .star-map {
      position: relative;
      height: 320px;
      background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .star-map .planet {
      position: absolute;
      transform: translate(-50%, -50%);
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
    }
    .star-map .planet:hover { transform: translate(-50%, -50%) scale(1.1); }
    .star-map .planet .planet-icon { font-size: 36px; filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.4)); }
    .star-map .planet .planet-name { font-size: 11px; color: var(--text-secondary); margin-top: 4px; white-space: nowrap; }
    .star-map .planet.unlocked .planet-icon { filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.6)); }
    .star-map .planet.current .planet-icon {
      animation: pulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 16px rgba(244, 114, 182, 0.8));
    }
    .star-map .planet.locked .planet-icon { opacity: 0.3; filter: grayscale(1); }
    .star-map .planet.locked .planet-name { opacity: 0.4; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .star-map .spaceship {
      position: absolute;
      font-size: 28px;
      transform: translate(-50%, -50%);
      z-index: 10;
      transition: all 1s ease;
      filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.6));
    }
    .star-map .path-line {
      position: absolute;
      border-top: 2px dashed rgba(129, 140, 248, 0.3);
      transform-origin: left center;
      z-index: 0;
    }
    .star-map .path-line.active {
      border-top-color: rgba(251, 191, 36, 0.5);
    }
    .journey-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
    }
    .journey-current { display: flex; align-items: center; gap: 12px; }
    .journey-current .planet-big { font-size: 40px; }
    .journey-current .info h3 { font-size: 18px; font-weight: 700; }
    .journey-current .info p { font-size: 13px; color: var(--text-secondary); }
    .journey-next { text-align: right; }
    .journey-next .next-label { font-size: 12px; color: var(--text-secondary); }
    .journey-next .next-planet { font-size: 16px; font-weight: 600; color: var(--primary-light); margin-top: 2px; }
    .journey-next .energy-needed { font-size: 13px; color: var(--star-gold); margin-top: 4px; }
    /* Ship status */
    .ship-status {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 12px;
    }
    .ship-stat {
      text-align: center;
      padding: 12px;
      background: rgba(15, 10, 31, 0.5);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .ship-stat .label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
    .ship-stat .value { font-size: 16px; font-weight: 600; color: var(--primary-light); }
    /* Responsive */
    @media (max-width: 768px) {
      .role-select { flex-direction: column; }
      .app-header { padding: 0 12px; }
      .app-main { padding: 16px 12px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .stat-value { font-size: 24px; }
      .nav-item { padding: 10px 14px; font-size: 13px; }
      .star-map { height: 240px; }
      .star-map .planet .planet-icon { font-size: 28px; }
      .journey-info { flex-direction: column; gap: 12px; text-align: center; }
      .journey-next { text-align: center; }
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    /* Jump animation */
    @keyframes warp {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(2) translateX(50px); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }
    .warping { animation: warp 1s ease-in-out; }
  </style>
</head>
<body>
  <!-- ===== Login Screen ===== -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">🚀</div>
      <div class="login-title">星途远航</div>
      <div class="login-subtitle">社交成长星际之旅 · 每一步都在飞向更远的星空</div>
      <div class="role-select">
        <div class="role-card active" data-role="user" onclick="Auth.selectRole('user')">
